[package]
name = "turbotalk"
version = "0.9.0"
description = "TurboTalk — personal voice dictation utility"
authors = ["IronTree Software"]
edition = "2021"
rust-version = "1.77"

# ── Feature flags ─────────────────────────────────────────────────────────────
# `moonshine` — enable the Moonshine ONNX transcription backend (TASK-58).
# `parakeet`  — enable the Parakeet TDT ONNX transcription backend (TASK-59).
#
# Both backends depend on `transcribe-rs`, which pins ort = "=2.0.0-rc.12".
# The old `vad-rs` dep pinned ort = "=2.0.0-rc.9" and blocked this.
# Resolution (TASK-62): vad-rs replaced with a direct ort rc.12 VAD in vad.rs.
# Now both VAD and the ONNX backends share the same ort pin — Cargo can unify.
#
# `transcribe-rs` is optional so users can still build without Moonshine/Parakeet
# by omitting those features. The dev build enables both by default.
[features]
default = ["moonshine", "parakeet"]
# `moonshine` activates MoonshineBackend in transcribe_backends/moonshine.rs.
moonshine = ["dep:transcribe-rs"]
# `parakeet` activates ParakeetBackend in transcribe_backends/parakeet.rs.
parakeet  = ["dep:transcribe-rs"]

[lib]
name = "turbotalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Serializes tests that mutate the process-wide settings cache (TASK-38).
serial_test = "3"

[dependencies]
tauri           = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
toml            = "0.8"
librewin-common = { git = "https://github.com/eldo9000/Libre-Apps.git", tag = "v0.1.3" }

# Audio
cpal            = "0.15"
hound           = "3.5"
rubato          = "0.15"
# Lock-free MPSC channel for the streaming audio finalizer (TASK-22). The
# capture-feeder thread ships chunks to the finalizer worker via a bounded
# channel; if the worker falls behind we drop on the worker side, never on
# the capture side. crossbeam-channel is already pulled in transitively
# through cpal, declaring it directly pins the API surface we depend on.
crossbeam-channel = "0.5"

# VAD: Silero v4 ONNX model run directly via `ort` rc.12. The `download-binaries`
# default feature pulls the onnxruntime native lib at build time — no system
# onnxruntime install required. vad-rs (which pinned ort rc.9) has been replaced
# by a direct ort rc.12 integration in vad.rs so both the VAD and the Moonshine/
# Parakeet ONNX backends share a single ort pin. We use ort's raw (shape, slice)
# tensor API to avoid ndarray version conflicts — transcribe-rs uses ndarray 0.17
# while a direct `ndarray` dep here would pull in 0.15 as a separate crate.
ort             = { version = "=2.0.0-rc.12", features = ["download-binaries"] }

# Clipboard / paste injection
arboard         = "3"
enigo           = "0.3"

# Async
tokio           = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "fs"] }

# HTTP for local LLM (Ollama) calls in cleanup.rs
reqwest         = { version = "0.12", features = ["json", "blocking", "multipart", "rustls-tls"], default-features = false }
url             = "2"

# TASK-58/59: Moonshine + Parakeet ONNX backends via transcribe-rs.
# Conflict resolved in TASK-62: vad-rs replaced with direct ort rc.12 in vad.rs.
# Both ort rc.12 (above) and transcribe-rs (below) now unify on the same pin.
transcribe-rs   = { version = "0.3.11", features = ["onnx"], optional = true }

# Misc
dirs            = "5"
parking_lot     = "0.12"
anyhow          = "1"
thiserror       = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tempfile        = "3"
flate2          = "1"

# Typed Rust↔TS config contract. `specta::Type` is derived on every type
# crossing the Tauri IPC boundary; `tauri-specta` wraps the commands with
# typed invoke helpers and emits `src/bindings.ts` from `lib.rs::run` in
# debug builds. See TASK-8.
specta            = { version = "=2.0.0-rc.24", features = ["derive"] }
specta-typescript = "=0.0.11"
tauri-specta      = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }

# macOS-only dependencies. `core-graphics` and `core-foundation` underpin the
# CGEventTap-based push-to-talk hotkey in `src/hotkey.rs`. Both crates use
# `std::os::unix` and `libc::PATH_MAX` internally, so they cannot compile for
# Windows targets — keeping them gated here lets `cargo check` succeed on
# non-mac targets even though the hotkey runtime path is mac-only.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics   = "0.24"
core-foundation = "0.10"
# Microphone TCC status query + native prompt (first-launch onboarding).
objc2               = "0.6"
objc2-foundation    = "0.3"
objc2-av-foundation = "0.3"
block2              = "0.6"

# Windows + Linux push-to-talk hotkey backend (TASK-25). `rdev` installs a
# global keyboard hook (Win32 `SetWindowsHookEx` on Windows, X11 `XRecord` on
# Linux) and surfaces raw `KeyPress` / `KeyRelease` events — exactly what
# push-to-talk needs and what `tauri-plugin-global-shortcut` does not provide.
# macOS keeps using CGEventTap directly; rdev is gated to non-mac targets so
# we don't drag in a duplicate event-source on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"
