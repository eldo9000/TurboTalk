[package]
name = "turbotalk"
version = "0.9.0"
description = "TurboTalk — personal voice dictation utility"
authors = ["IronTree Software"]
edition = "2021"
rust-version = "1.77"

# ── Feature flags ─────────────────────────────────────────────────────────────
# `moonshine` — enable the Moonshine ONNX transcription backend (TASK-58).
#
# Why feature-gated:
#   transcribe-rs 0.3.x pins ort = "=2.0.0-rc.12" (via its `onnx` feature).
#   vad-rs 0.1.5   pins ort = "=2.0.0-rc.9".
#   Cargo cannot unify two different =exact-pinned versions of the same crate,
#   so both crates cannot be active in the same build simultaneously.
#
#   Gating `transcribe-rs` behind the `moonshine` feature means the default
#   dev/release build continues to use vad-rs (rc.9) without conflicts.
#   To activate Moonshine: `cargo build --features moonshine`
#   (note: the VAD path then uses whatever ort version transcribe-rs pulls).
#
#   Long-term resolution: wait for vad-rs to update to ort rc.12, then both
#   crates can coexist in the default build and this gate can be removed.
[features]
default = []
# `moonshine` activates MoonshineBackend in transcribe_backends/moonshine.rs.
# Currently a no-op feature (no additional deps) because transcribe-rs cannot
# be added to Cargo.toml due to the ort version conflict with vad-rs.
# Once unblocked, uncomment the transcribe-rs dep below and change this to:
#   moonshine = ["dep:transcribe-rs"]
moonshine = []

[lib]
name = "turbotalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Serializes tests that mutate the process-wide settings cache (TASK-38).
serial_test = "3"

[dependencies]
tauri           = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
toml            = "0.8"
librewin-common = { git = "https://github.com/eldo9000/Libre-Apps.git", tag = "v0.1.3" }

# Audio
cpal            = "0.15"
hound           = "3.5"
rubato          = "0.15"
# Lock-free MPSC channel for the streaming audio finalizer (TASK-22). The
# capture-feeder thread ships chunks to the finalizer worker via a bounded
# channel; if the worker falls behind we drop on the worker side, never on
# the capture side. crossbeam-channel is already pulled in transitively
# through cpal, declaring it directly pins the API surface we depend on.
crossbeam-channel = "0.5"

# VAD: Silero v4 ONNX model wrapped via vad-rs. The transitive `ort` crate pulls
# the onnxruntime native lib at build time via its `download-binaries` default
# feature, so the resulting binary is self-contained — no system onnxruntime
# install required. We disable vad-rs's `helpers` feature (ebur128 + samplerate)
# because we already do our own resampling/normalization in audio.rs.
#
# `ort-sys` is pinned to the same rc.9 release as `ort` (vad-rs's transitive
# `=2.0.0-rc.9` constraint). Cargo's default resolver prefers the newest
# semver-compatible ort-sys, which lands on rc.12 — but rc.12 introduced a
# mandatory TLS-feature compile_error! that the old rc.9 ort wrapper can't
# satisfy. Pinning ort-sys to rc.9 here keeps the build self-contained and
# the ABI matched with ort's expectations.
vad-rs          = { version = "0.1.5", default-features = false }
ort-sys         = "=2.0.0-rc.9"

# Clipboard / paste injection
arboard         = "3"
enigo           = "0.3"

# Async
tokio           = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "fs"] }

# HTTP for local LLM (Ollama) calls in cleanup.rs
reqwest         = { version = "0.12", features = ["json", "blocking", "multipart", "rustls-tls"], default-features = false }
url             = "2"

# TASK-58: Moonshine ONNX backend.
#
# BLOCKED: transcribe-rs 0.3.11 pins ort = "=2.0.0-rc.12" (via its `onnx`
# feature). vad-rs 0.1.5 pins ort = "=2.0.0-rc.9". Cargo's global dependency
# resolver cannot unify two exact-pinned versions of `ort` — even when
# transcribe-rs is declared optional, the resolver still fails because it
# resolves ALL crates (including optionals) in one pass.
#
# Unblock options:
#   (a) Wait for vad-rs to update to ort rc.12, then both can coexist.
#   (b) Replace vad-rs with a direct ort rc.12 VAD integration.
#   (c) Move transcribe-rs into a separate Cargo workspace member that builds
#       as a sidecar binary, communicating with the main process via IPC.
#
# The MoonshineBackend implementation in transcribe_backends/moonshine.rs is
# complete and correct; it compiles when `transcribe-rs` is resolvable.
# Uncomment the line below once the ort version conflict is resolved:
#
# transcribe-rs   = { version = "0.3.11", features = ["onnx"], optional = true }

# Misc
dirs            = "5"
parking_lot     = "0.12"
anyhow          = "1"
thiserror       = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tempfile        = "3"
flate2          = "1"

# Typed Rust↔TS config contract. `specta::Type` is derived on every type
# crossing the Tauri IPC boundary; `tauri-specta` wraps the commands with
# typed invoke helpers and emits `src/bindings.ts` from `lib.rs::run` in
# debug builds. See TASK-8.
specta            = { version = "=2.0.0-rc.24", features = ["derive"] }
specta-typescript = "=0.0.11"
tauri-specta      = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }

# macOS-only dependencies. `core-graphics` and `core-foundation` underpin the
# CGEventTap-based push-to-talk hotkey in `src/hotkey.rs`. Both crates use
# `std::os::unix` and `libc::PATH_MAX` internally, so they cannot compile for
# Windows targets — keeping them gated here lets `cargo check` succeed on
# non-mac targets even though the hotkey runtime path is mac-only.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics   = "0.24"
core-foundation = "0.10"
# Microphone TCC status query + native prompt (first-launch onboarding).
objc2               = "0.6"
objc2-foundation    = "0.3"
objc2-av-foundation = "0.3"
block2              = "0.6"

# Windows + Linux push-to-talk hotkey backend (TASK-25). `rdev` installs a
# global keyboard hook (Win32 `SetWindowsHookEx` on Windows, X11 `XRecord` on
# Linux) and surfaces raw `KeyPress` / `KeyRelease` events — exactly what
# push-to-talk needs and what `tauri-plugin-global-shortcut` does not provide.
# macOS keeps using CGEventTap directly; rdev is gated to non-mac targets so
# we don't drag in a duplicate event-source on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"
