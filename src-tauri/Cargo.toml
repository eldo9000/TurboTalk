[package]
name = "turbotalk"
version = "0.0.1"
description = "TurboTalk — personal voice dictation utility"
authors = ["IronTree Software"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "turbotalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri           = { version = "2", features = ["macos-private-api", "tray-icon"] }
core-graphics   = "0.24"
core-foundation = "0.10"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
toml            = "0.8"
librewin-common = { git = "https://github.com/eldo9000/Libre-Apps.git", tag = "v0.1.3" }

# Audio
cpal            = "0.15"
hound           = "3.5"

# Clipboard / paste injection
arboard         = "3"
enigo           = "0.3"

# Async
tokio           = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync"] }

# HTTP for local LLM (Ollama) calls in cleanup.rs
reqwest         = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
url             = "2"

# Misc
dirs            = "5"
parking_lot     = "0.12"
anyhow          = "1"
thiserror       = "1"
tracing         = "0.1"
tracing-subscriber = "0.3"
tauri-plugin-shell = "2.0.0-rc.4"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile        = "3"
