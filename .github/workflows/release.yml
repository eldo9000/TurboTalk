# =============================================================================
# TurboTalk — Unsigned Beta Release Pipeline
# =============================================================================
#
# Builds unsigned beta artifacts for macOS (arm64) and Windows (x64) on
# tag push (v*), uploads them as workflow artifacts, and attaches them to
# a draft GitHub release.
#
# UNSIGNED. This is a personal-use beta — no Apple, Windows, or Linux
# trust-chain credentials are referenced anywhere below.
#
# Linux is intentionally excluded from this release. Add it back to the
# matrix when the Linux runtime path (rdev under X11, AppImage system
# deps) has been validated on real hardware.
#
# Whisper sidecar:
#   - macOS arm64 binary is committed under src-tauri/binaries/.
#   - Windows binary is built from source on the windows-latest runner
#     during the workflow (static build, single .exe, no DLLs needed).
#
# Manual `workflow_dispatch` runs build but do NOT publish a release.
# =============================================================================

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.target_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_label: macos-arm64
          - os: windows-latest
            target_label: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Windows whisper-cli sidecar (static)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $whisperRef = "v1.7.5"
          $whisperDir = "$env:RUNNER_TEMP\whisper.cpp"
          git clone --depth 1 --branch $whisperRef https://github.com/ggerganov/whisper.cpp $whisperDir
          Push-Location $whisperDir
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build build --config Release --target whisper-cli
          Pop-Location
          $exeSrc = Get-ChildItem -Path "$whisperDir\build" -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (-not $exeSrc) { throw "whisper-cli.exe not found after build" }
          $dest = "$env:GITHUB_WORKSPACE\src-tauri\binaries\whisper-cli-x86_64-pc-windows-msvc.exe"
          Copy-Item $exeSrc.FullName $dest -Force
          & $dest --version

      - name: Install npm dependencies
        run: npm install

      - name: Package
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbotalk-${{ matrix.target_label }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist-artifacts/**/* \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes-from-tag
