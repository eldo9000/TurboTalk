# TurboTalk — Release pipeline (macOS arm64 only)
#
# Builds, ad-hoc or Developer-ID signs, repacks, and re-signs the updater
# tarball so the embedded pubkey in tauri.conf.json can verify it. Generates
# latest.json and creates a GitHub release on tag push.
#
# Signing is conditional: if Apple Developer ID credentials are present as
# GitHub secrets, the macOS .app and .dmg are Developer-ID-signed and
# notarized by Apple. If absent, ad-hoc signing is used (Gatekeeper warning
# on downloaded artifacts).
#
# BEFORE FIRST USE:
#   1. Run: npx tauri signer generate -w ~/.tauri/turbotalk.key
#   2. Add TAURI_SIGNING_PRIVATE_KEY to GitHub repo secrets:
#        base64 -i ~/.tauri/turbotalk.key | tr -d '\n'
#   3. Add TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty string if no passphrase)
#   4. Copy the public key output and replace PLACEHOLDER_REPLACE_WITH_TAURI_PUBKEY_AFTER_npx_tauri_signer_generate
#      in src-tauri/tauri.conf.json
#   5. Add LIBRE_APPS_TOKEN (fine-grained PAT, Contents:Read on eldo9000/Libre-Apps)
#
# OPTIONAL (enables Developer ID signing + notarization):
#   6. Add APPLE_SIGNING_IDENTITY — SHA-1 hash or full "Developer ID Application: ..." string
#   7. Add APPLE_ID — Apple ID email for notarization
#   8. Add APPLE_PASSWORD — app-specific password (not your Apple ID password)
#   9. Add APPLE_TEAM_ID — 10-character Apple Team ID
#  10. Add WINDOWS_SIGNING_CERTIFICATE — base64-encoded PFX/P12 cert
#  11. Add WINDOWS_SIGNING_PASSWORD — PFX/P12 private-key password
#
# See docs/BUILD.md → "Release build (signed + notarized)" for setup steps.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.8.7). Must already exist.'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build (darwin-aarch64)
    runs-on: macos-14
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      _RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      _RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Apple Developer ID signing — set these secrets to enable Developer ID
      # signing + notarization. When absent, ad-hoc signing is used.
      _RAW_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      macos_signed: ${{ steps.apple_signing_check.outputs.macos_signed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Apple signing credentials
        id: apple_signing_check
        run: |
          if [ -n "${_RAW_APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "macos_signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple Developer ID credentials found — will sign and notarize."
          else
            echo "macos_signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple Developer ID credentials — using ad-hoc signing."
          fi

      - name: Decode signing key from armored secret
        # TAURI_SIGNING_PRIVATE_KEY must be: base64 -i ~/.tauri/turbotalk.key | tr -d '\n'
        run: |
          set -euo pipefail
          if [ -z "${_RAW_TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/turbotalk-signing.key"
          if ! printf '%s' "$_RAW_TAURI_SIGNING_PRIVATE_KEY" | base64 --decode > "$KEY_FILE" 2>/tmp/b64err; then
            echo "::error::Could not base64-decode TAURI_SIGNING_PRIVATE_KEY."
            cat /tmp/b64err
            exit 1
          fi
          chmod 600 "$KEY_FILE"
          KEY_LEN=$(wc -c < "$KEY_FILE" | tr -d ' ')
          echo "decoded key length: $KEY_LEN bytes (expected 348)"
          CLEAN_PW=$(printf '%s' "${_RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" | tr -d '\r\n')
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_FILE"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$CLEAN_PW"
            echo "TT_SIGNING_KEY_FILE=$KEY_FILE"
          } >> "$GITHUB_ENV"

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::could not determine tag"
            exit 1
          fi
          VERSION="${TAG#v}"
          VERSION_BASE="${VERSION%%-*}"
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "version_base=$VERSION_BASE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION version_base=$VERSION_BASE"

      - name: Verify tag matches tauri.conf.json version
        run: |
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VERSION_BASE="${{ steps.tag.outputs.version_base }}"
          echo "tauri.conf.json version: $CONF_VERSION"
          echo "tag base version:        $TAG_VERSION_BASE"
          if [ "$CONF_VERSION" != "$TAG_VERSION_BASE" ]; then
            echo "::error::tag base version ($TAG_VERSION_BASE) does not match src-tauri/tauri.conf.json version ($CONF_VERSION). Bump the config before tagging."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Configure git auth for private cargo deps
        env:
          LIBRE_APPS_TOKEN: ${{ secrets.LIBRE_APPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LIBRE_APPS_TOKEN:-}" ]; then
            echo "::error::LIBRE_APPS_TOKEN secret is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
            -H "Authorization: Bearer ${LIBRE_APPS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/eldo9000/Libre-Apps)
          if [ "$code" != "200" ]; then
            echo "::error::LIBRE_APPS_TOKEN cannot read eldo9000/Libre-Apps (HTTP $code)."
            cat /tmp/probe.json
            exit 1
          fi
          git config --global \
            "url.https://oauth2:${LIBRE_APPS_TOKEN}@github.com/.insteadOf" \
            "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-aarch64-apple-darwin-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-cargo-aarch64-apple-darwin-

      - name: Install npm deps
        run: npm ci

      - name: Install whisper.cpp (provides whisper-server sidecar)
        run: brew install whisper-cpp

      - name: Patch Homebrew whisper-server rpath for bundle layout
        # Tauri places bundle.resources into Contents/Resources/. Patch the
        # Homebrew binary BEFORE `tauri build` so the bundled DMG, .app, and
        # updater tarball all carry the corrected rpath. Doing this post-build
        # only patches the .app and tarball — the DMG keeps the original.
        run: install_name_tool -add_rpath @executable_path/../Resources/ /opt/homebrew/bin/whisper-server

      - name: Fetch Whisper sidecars
        run: npm run fetch-sidecars

      - name: Fetch Silero VAD model
        run: npm run fetch-vad-model

      - name: Set Apple signing env (if Developer ID credentials present)
        run: |
          if [ "${{ steps.apple_signing_check.outputs.macos_signed }}" = "true" ]; then
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"                     >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"         >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"           >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        # Enable updater artifacts (.app.tar.gz + .sig) here, NOT in
        # tauri.conf.json. createUpdaterArtifacts is kept false in the committed
        # config so local `npm run package` stays DMG-only and does not require
        # TAURI_SIGNING_PRIVATE_KEY. CI has the decoded key in env (see "Decode
        # signing key" step), so the build can produce the signed tarball the
        # Locate step requires. The tarball is later re-packed and re-signed from
        # the ad-hoc-signed .app (unsigned beta) or Developer-ID-signed .app
        # (signed release).
        run: npm run tauri build -- --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Locate macOS build output
        id: mac_artifacts
        run: |
          set -euo pipefail
          V='${{ steps.tag.outputs.version_base }}'
          BUNDLE_DIR="target/aarch64-apple-darwin/release/bundle"
          APP_PATH="$BUNDLE_DIR/macos/TurboTalk.app"
          # Tauri uses productName (with space) for the app bundle but strips
          # spaces for the filename in some versions — probe both.
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$BUNDLE_DIR/macos/Turbo Talk.app"
          fi
          TARBALL="$BUNDLE_DIR/macos/TurboTalk.app.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            TARBALL=$(ls "$BUNDLE_DIR"/macos/*.app.tar.gz | head -n1)
          fi
          SIG="${TARBALL}.sig"
          DMG=$(ls "$BUNDLE_DIR"/dmg/*.dmg | head -n1)
          for f in "$APP_PATH" "$TARBALL" "$SIG" "$DMG"; do
            if [ ! -e "$f" ]; then
              echo "::error::missing expected artifact: $f"
              exit 1
            fi
          done
          echo "app_path=$APP_PATH"     >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL"       >> "$GITHUB_OUTPUT"
          echo "sig=$SIG"               >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG"               >> "$GITHUB_OUTPUT"
          echo "bundle_dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc codesign and strip quarantine
        # Only needed for unsigned beta builds. When Developer ID signing was
        # used during `tauri build`, the .app is already properly signed and
        # re-signing with ad-hoc would strip the Developer ID signature.
        if: steps.apple_signing_check.outputs.macos_signed == 'false'
        run: |
          set -euo pipefail
          APP='${{ steps.mac_artifacts.outputs.app_path }}'
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"

      - name: Verify macOS bundle (signature + linkage + contents)
        # Gates on the same checks the local `package` flow runs: required files,
        # no Homebrew/CoreML linkage leaks, and a valid code signature. This
        # previously only ran locally, so a bad release bundle could ship; the
        # inline `codesign --verify … || true` here was a no-op. Now it fails hard.
        run: node scripts/verify-macos-bundle.mjs '${{ steps.mac_artifacts.outputs.app_path }}'

      - name: Verify Developer ID signing and notarization
        # Runs only when Apple signing credentials were used. Confirms the .app
        # carries a Developer ID signature and the DMG is notarized.
        if: steps.apple_signing_check.outputs.macos_signed == 'true'
        run: |
          set -euo pipefail
          APP='${{ steps.mac_artifacts.outputs.app_path }}'
          DMG='${{ steps.mac_artifacts.outputs.dmg }}'
          echo "=== Code signature ==="
          codesign -dv --verbose=4 "$APP" 2>&1
          echo "=== App assessment ==="
          spctl --assess --type execute --verbose=4 "$APP" 2>&1
          echo "=== DMG assessment ==="
          spctl -a -t open --context context:primary-signature -v "$DMG" 2>&1
          echo "Notarization verified."

      - name: Re-pack updater tarball from signed .app
        run: |
          set -euo pipefail
          APP='${{ steps.mac_artifacts.outputs.app_path }}'
          TARBALL='${{ steps.mac_artifacts.outputs.tarball }}'
          APP_DIR=$(dirname "$APP")
          APP_NAME=$(basename "$APP")
          rm -f "$TARBALL"
          tar -czf "$TARBALL" -C "$APP_DIR" "$APP_NAME"
          ls -la "$TARBALL"

      - name: Re-sign updater tarball with Tauri minisign key
        run: |
          set -euo pipefail
          TARBALL='${{ steps.mac_artifacts.outputs.tarball }}'
          SIG='${{ steps.mac_artifacts.outputs.sig }}'
          rm -f "$SIG"
          unset TAURI_SIGNING_PRIVATE_KEY
          npx --yes @tauri-apps/cli signer sign \
            -f "$TT_SIGNING_KEY_FILE" \
            -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" \
            "$TARBALL"
          if [ ! -s "$SIG" ]; then
            echo "::error::signer did not produce $SIG"
            exit 1
          fi
          echo "re-signed tarball:"
          ls -la "$TARBALL" "$SIG"

      - name: Stage artifacts
        id: stage
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/turbotalk-stage"
          mkdir -p "$STAGE"
          cp '${{ steps.mac_artifacts.outputs.dmg }}'     "$STAGE/"
          cp '${{ steps.mac_artifacts.outputs.tarball }}' "$STAGE/"
          cp '${{ steps.mac_artifacts.outputs.sig }}'     "$STAGE/"
          echo "--- staged files ---"
          ls -la "$STAGE"
          echo "stage=$STAGE"                                       >> "$GITHUB_OUTPUT"
          echo "sig_file=$STAGE/$(basename '${{ steps.mac_artifacts.outputs.sig }}')" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: turbotalk-darwin-aarch64
          path: ${{ steps.stage.outputs.stage }}/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload signature (for finalize job)
        uses: actions/upload-artifact@v4
        with:
          name: turbotalk-sig-darwin-aarch64
          path: ${{ steps.stage.outputs.sig_file }}
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build (windows-x64)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      _RAW_WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-x86_64-pc-windows-msvc-

      - name: Configure git auth for private cargo deps
        env:
          LIBRE_APPS_TOKEN: ${{ secrets.LIBRE_APPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LIBRE_APPS_TOKEN:-}" ]; then
            echo "::error::LIBRE_APPS_TOKEN secret is not set."
            exit 1
          fi
          git config --global \
            "url.https://oauth2:${LIBRE_APPS_TOKEN}@github.com/.insteadOf" \
            "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install npm deps
        run: npm ci

      - name: Fetch Whisper sidecars
        run: npm run fetch-sidecars

      - name: Package
        run: npm run package

      - name: Authenticode sign installer (conditional)
        # Signs the NSIS installer with an Authenticode certificate when
        # WINDOWS_SIGNING_CERTIFICATE and WINDOWS_SIGNING_PASSWORD are
        # configured as GitHub secrets. Skips cleanly for unsigned beta builds.
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${_RAW_WINDOWS_SIGNING_CERTIFICATE:-}" ]; then
            echo "WINDOWS_SIGNING_CERTIFICATE not set — skipping Authenticode signing."
            exit 0
          fi
          CERT_FILE="$RUNNER_TEMP/signing.pfx"
          if ! printf '%s' "$_RAW_WINDOWS_SIGNING_CERTIFICATE" | base64 --decode > "$CERT_FILE" 2>/dev/null; then
            echo "::warning::Could not base64-decode WINDOWS_SIGNING_CERTIFICATE — skipping."
            exit 0
          fi
          INSTALLER=$(ls dist-artifacts/*.exe | head -n1)
          if [ -z "$INSTALLER" ]; then
            echo "::warning::No installer found in dist-artifacts/ — skipping signing."
            rm -f "$CERT_FILE"
            exit 0
          fi
          signtool sign /fd SHA256 /a /f "$CERT_FILE" /p "${WINDOWS_SIGNING_PASSWORD:-}" "$INSTALLER"
          rm -f "$CERT_FILE"
          echo "Windows installer signed successfully."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbotalk-windows-x64
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Assemble latest.json and publish release
    needs: [build, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          VERSION_BASE="${VERSION%%-*}"
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "version_base=$VERSION_BASE" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: turbotalk-*
          merge-multiple: false

      - name: Copy DMG with stable name for direct-download link
        run: |
          DMG=$(ls dist/turbotalk-darwin-aarch64/*.dmg | head -n1)
          cp "$DMG" dist/turbotalk-darwin-aarch64/TurboTalk-macOS-arm64.dmg

      - name: Copy Windows installer with stable name for direct-download link
        run: |
          EXE=$(ls dist/turbotalk-windows-x64/*.exe | head -n1)
          cp "$EXE" dist/turbotalk-windows-x64/TurboTalk-Windows-x64-setup.exe

      - name: Generate latest.json
        id: manifest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG" 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES="See GitHub release notes."
          fi

          DARWIN_SIG_FILE="dist/turbotalk-sig-darwin-aarch64/$(ls dist/turbotalk-sig-darwin-aarch64/ | head -n1)"
          if [ ! -s "$DARWIN_SIG_FILE" ]; then
            echo "::error::missing signature file: $DARWIN_SIG_FILE"
            exit 1
          fi

          TARBALL_NAME=$(ls dist/turbotalk-darwin-aarch64/*.app.tar.gz | head -n1 | xargs basename)

          export NOTES PUB_DATE DARWIN_SIG_FILE TARBALL_NAME
          node - <<'NODE_EOF' > latest.json
          const fs = require('fs');
          const base = 'https://github.com/eldo9000/TurboTalk-App/releases/download/' + process.env.TAG + '/';
          const manifest = {
            version: process.env.VERSION,
            notes: process.env.NOTES,
            pub_date: process.env.PUB_DATE,
            platforms: {
              'darwin-aarch64': {
                signature: fs.readFileSync(process.env.DARWIN_SIG_FILE, 'utf8'),
                url: base + process.env.TARBALL_NAME,
              },
            },
          };
          process.stdout.write(JSON.stringify(manifest, null, 2) + '\n');
          NODE_EOF

          echo "--- latest.json ---"
          cat latest.json

      - name: Generate release body
        id: release_body
        env:
          MACOS_SIGNED: ${{ needs.build.outputs.macos_signed }}
        run: |
          if [ "$MACOS_SIGNED" = "true" ]; then
            cat > /tmp/release-body.md <<'BODY_EOF'
          ## TurboTalk ${{ steps.tag.outputs.tag }}

          macOS (Apple Silicon) only.
          Distribution is signed with Developer ID and notarized by Apple.

          **Install:** open the DMG and drag `TurboTalk.app` to `/Applications`.

          **Existing users:** the in-app updater will pick this release up
          automatically within a week of last check.
          BODY_EOF
          else
            cat > /tmp/release-body.md <<'BODY_EOF'
          ## TurboTalk ${{ steps.tag.outputs.tag }}

          macOS (Apple Silicon) only.
          Distribution is ad-hoc signed (no Apple Developer ID).

          **Install:** open the DMG and drag `TurboTalk.app` to `/Applications`.
          If Gatekeeper blocks launch, run:

          ```
          xattr -cr /Applications/TurboTalk.app
          ```

          **Existing users:** the in-app updater will pick this release up
          automatically within a week of last check.
          BODY_EOF
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TurboTalk ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          fail_on_unmatched_files: true
          body_path: /tmp/release-body.md
          files: |
            dist/turbotalk-darwin-aarch64/*
            dist/turbotalk-windows-x64/*
            latest.json
