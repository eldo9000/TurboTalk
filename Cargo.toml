[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.lints.clippy]
all                  = { level = "warn", priority = -1 }
unwrap_used          = "warn"
await_holding_lock   = "deny"
needless_collect     = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
